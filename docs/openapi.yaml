          type: string
          example: Platos Fuertes
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CategoriaRequest:
      type: object
      required:
        - nombre
      properties:
        nombre:
          type: string
          example: Bebidas
