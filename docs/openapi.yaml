      description: Bloquea atómicamente una mesa en estado 'Libre' pasándola a 'Ocupada' y creando un bloqueo temporal de 10 minutos asignado al usuario autenticado (Mesero o Administrador). Previene que otros meseros abran comandas en simultáneo sobre la misma mesa.
