          format: date-time
x-websockets:
  description: Extensión personalizada de documentación para la arquitectura de eventos en tiempo real mediante Socket.IO. No forma parte del estándar nativo de OpenAPI 3.0.3.
  transport: websocket
  events:
    mesas:updated:
      summary: Actualización global de estado y datos de mesa
      description: Emitido a todos los clientes conectados ante cualquier mutación, cambio de estado, bloqueo temporal o liberación de mesa.
      payload:
        $ref: "#/components/schemas/MesaResponseDTO"
    mesas:created:
      summary: Creación de mesas
      payload:
        oneOf:
          - $ref: "#/components/schemas/MesaResponseDTO"
          - type: array
            items:
              $ref: "#/components/schemas/MesaResponseDTO"
    mesas:deleted:
      summary: Eliminación de mesa
      payload:
        type: object
        properties:
          id:
            type: string
          mesaId:
            type: string
    mesas:alerta_listo:
      summary: Alerta de comanda lista para servir
