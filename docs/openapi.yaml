  /api/pedidos/{id}/recoger:
    patch:
      tags:
        - Pedidos
      summary: Marcar pedido como recogido por el mesero
      description: Registra la recogida física del pedido por el mesero responsable o un Administrador cuando está en estado ENTREGADO. El estado del pedido se mantiene en ENTREGADO. Remueve el pedido del tablero activo de Cocina y emite eventos en tiempo real.
      operationId: marcarPedidoRecogido
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador del pedido
          schema:
            type: string
          example: "{{pedidoId}}"
      responses:
        "200":
          description: Pedido marcado como recogido exitosamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarcarPedidoRecogidoResponse"
        "400":
          description: ID inválido o el pedido no está en estado ENTREGADO
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeErrorResponse"
        "401":
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeErrorResponse"
        "403":
          description: Acceso denegado (solo el mesero responsable del pedido o un Administrador)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeErrorResponse"
        "404":
          description: Pedido no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeErrorResponse"
        "409":
          description: El pedido ya fue marcado como recogido previamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeErrorResponse"
        "500":
          description: Error interno al marcar pedido como recogido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeErrorResponse"
  /api/pedidos/{id}/cancel:
    patch:
      tags:
        - Pedidos
      summary: Cancelar pedido y liberar mesa
      description: Cancela un pedido cambiando su estado a CANCELADO y libera la mesa poniéndola en "Libre" (emitiendo statusSocket "Disponible" en WebSocket). Requiere rol Administrador o ser el Mesero que registró el pedido.
      operationId: cancelarPedido
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador del pedido
          schema:
            type: string
          example: "{{pedidoId}}"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelarPedidoRequest"
      responses:
        "200":
          description: Pedido cancelado y mesa liberada correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelarPedidoResponse"
        "400":
          description: Pedido en estado no cancelable (ENTREGADO, CERRADO o CANCELADO)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeErrorResponse"
        "401":
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeErrorResponse"
        "403":
          description: Acceso denegado (solo el mesero responsable del pedido o un Administrador pueden cancelar el pedido)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeErrorResponse"
        "404":
          description: Pedido no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeErrorResponse"
        "500":
          description: Error al cancelar pedido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeErrorResponse"
  /api/pagos/generar-qr/{pedidoId}:
