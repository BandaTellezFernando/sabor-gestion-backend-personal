  /api/pagos/{pedidoId}/procesar:
    post:
      tags:
        - Pagos
      summary: Procesar pago final y cerrar orden
      description: "Procesa el cobro final del pedido mediante una transacción atómica en MongoDB. El backend ejerce autoridad financiera exclusiva: recalcula el subtotal oficial a partir de los detalles del pedido persistido, ignorando cualquier subtotal provisto en el body. Admite opcionalmente datos de facturación (clienteNombre, clienteCI, clienteNIT) y desglose de descuentos y propinas. Cierra el pedido (estado CERRADO), libera la mesa (estado Libre), registra el documento en la colección de pagos y genera el comprobante de pago final. Requiere rol Cajero o Administrador."
      operationId: procesarPagoFinal
      security:
        - bearerAuth: []
      parameters:
        - name: pedidoId
          in: path
          required: true
          description: Identificador del pedido
          schema:
            type: string
          example: "{{pedidoId}}"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcesarPagoRequest"
      responses:
        "200":
          description: Pago procesado exitosamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcesarPagoResponse"
        "400":
          description: Pedido ya cerrado o cancelado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeErrorResponse"
        "401":
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeErrorResponse"
        "403":
          description: Acceso denegado (requiere Cajero o Administrador)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeErrorResponse"
        "404":
          description: Pedido no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeErrorResponse"
        "500":
          description: Error al procesar el pago
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeErrorResponse"
  /api/pagos/notificar-qr/{pedidoId}:
    post:
      tags:
        - Pagos
      summary: Simular notificación de pago QR
      description: Endpoint público de simulación que representa un webhook bancario o interacción de dispositivo externo confirmando un pago QR. No requiere autenticación JWT. Este endpoint NO crea un registro de Pago, NO cierra el Pedido, NO libera la Mesa ni ejecuta transacciones financieras; únicamente emite el evento WebSocket de alerta a caja (caja:notificacion_qr). El cobro oficial debe completarse posteriormente mediante POST /api/pagos/{pedidoId}/procesar con metodoPago = "QR".
      operationId: simularPagoQR
      parameters:
        - name: pedidoId
          in: path
          required: true
          description: Identificador del pedido
          schema:
            type: string
          example: "{{pedidoId}}"
      responses:
        "200":
          description: Simulación exitosa y caja notificada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimularPagoQRResponse"
        "404":
          description: Pedido no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeErrorResponse"
        "500":
          description: Error al simular pago QR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeErrorResponse"
  /api/pagos/{pedidoId}/enviar-recibo:
    post:
      tags:
