  /api/pedidos/{id}:
    put:
      tags:
        - Pedidos
      summary: Actualizar contenido de un pedido
      description: Actualiza platos (detalles), descuentos, propinas o datos del comensal. El backend recalcula los subtotales e importes con los precios oficiales de Plato obtenidos vía PlatoRepository y almacena el snapshot histórico; no confía en montos provistos por el cliente. Los campos 'total', 'subtotalCierre' y 'metodoPago' son ignorados por el backend (autoridad financiera exclusiva), mientras que cualquier intento de enviar 'estado' es explícitamente rechazado con 400. Si el pedido estaba en ENTREGADO y se añaden platos, se reabre a ABIERTO y la mesa se reactiva como Ocupada. Requiere rol Administrador o ser el Mesero que registró el pedido.
      operationId: actualizarPedido
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador del pedido
          schema:
            type: string
          example: "{{pedidoId}}"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActualizarPedidoRequest"
      responses:
        "200":
          description: Pedido actualizado exitosamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pedido"
        "400":
          description: Error de validación (intento de enviar 'estado', modificación sobre pedido CERRADO o CANCELADO, montos negativos o cantidades inválidas)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeErrorResponse"
        "401":
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeErrorResponse"
        "403":
          description: Acceso denegado (solo el mesero responsable del pedido o un Administrador pueden modificarlo)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeErrorResponse"
        "404":
          description: Pedido no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeErrorResponse"
        "500":
          description: Error al actualizar el pedido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeErrorResponse"
    get:
      tags:
        - Pedidos
      summary: Obtener detalle de un pedido por ID
      description: |-
        Obtiene los datos detallados de un pedido específico por su identificador único (ObjectId). Aplica control de acceso basado en roles (RBAC) y sanitización según el perfil autenticado:

        - **Administrador**: Acceso total al pedido completo con importes financieros y comensal.
        - **Mesero**: Únicamente puede consultar pedidos propios registrados por él (retorna 403 si pertenece a otro mesero).
        - **Cocinero**: Únicamente puede consultar pedidos dentro del flujo culinario activo (estados ABIERTO, EN_PREPARACION, o ENTREGADO pendiente de recogida). Recibe la comanda operativa sanitizada sin montos financieros ni datos de facturación (PedidoCocinaDTO). Retorna 403 si el pedido se encuentra fuera del flujo de cocina.
        - **Cajero**: Únicamente puede consultar pedidos con cuenta solicitada (mesa en 'Cuenta Solicitada'), asignados a él o en proceso de cobro. Retorna 403 si no está en proceso de cobro.

        Requiere rol Administrador, Mesero, Cocinero o Cajero.
      operationId: obtenerPedidoPorId
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador de MongoDB del pedido (ObjectId)
          schema:
            type: string
          example: "000000000000000000000070"
      responses:
        "200":
          description: Detalle del pedido obtenido exitosamente. Para rol Cocinero retorna la comanda operativa sanitizada (PedidoCocinaDTO); para Administrador, Mesero y Cajero retorna el documento de pedido completo (Pedido).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Pedido"
                  - $ref: "#/components/schemas/PedidoCocinaDTO"
        "400":
          description: ID de pedido inválido (no es un ObjectId válido de MongoDB)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeErrorResponse"
              example:
                mensaje: ID de pedido inválido
        "401":
          description: No autenticado o token inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeErrorResponse"
        "403":
          description: Acceso denegado por falta de alcance o rol no autorizado (mesero consultando pedido ajeno, cocinero consultando pedido fuera del flujo activo, cajero consultando pedido fuera de cobro)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeErrorResponse"
              examples:
                meseroAjeno:
                  summary: Mesero consultando pedido de otro mesero
                  value:
                    mensaje: "Acceso denegado: no puedes consultar pedidos asignados a otro mesero."
                cocineroFueraFlujo:
                  summary: Cocinero consultando pedido fuera de cocina
                  value:
                    mensaje: "Acceso denegado: el pedido no se encuentra en el flujo culinario activo."
                cajeroFueraCobro:
                  summary: Cajero consultando pedido no pendiente de cobro
                  value:
                    mensaje: "Acceso denegado: el pedido no está en proceso de cobro ni asignado a este cajero."
        "404":
          description: Pedido no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeErrorResponse"
              example:
                mensaje: Pedido no encontrado
        "500":
          description: Error al obtener el pedido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeErrorResponse"
              example:
                mensaje: Error al obtener el pedido
