          type: string
          example: platos/pique_123
        categoria:
          type: string
          example: '{{categoriaId}}'
    ActualizarPlatoRequest:
      type: object
      properties:
        nombre:
          type: string
          example: Pique Macho Especial
        descripcion:
          type: string
          example: Pique tradicional con porción extra de carne.
        precio:
          type: number
          example: 75
        imagenUrl:
          type: string
          example: https://res.cloudinary.com/demo/image/upload/pique_esp.jpg
        imagenPublicId:
          type: string
          example: platos/pique_esp_456
        categoria:
          type: string
          example: '{{categoriaId}}'
        disponible:
          type: boolean
          example: true
    MesaDTO:
      type: object
      properties:
        id:
          type: string
          example: '000000000000000000000030'
        _id:
          type: string
          example: '000000000000000000000030'
        name:
          type: string
          example: Mesa 1 Interior
        numero:
          type: string
          example: Mesa 1 Interior
        capacity:
          type: integer
          example: 4
        location:
          type: string
          example: Interior
        locationId:
          type: string
          nullable: true
          example: '000000000000000000000040'
        status:
          type: string
          example: Disponible
          description: Mapeo para visualización en frontend y eventos WebSocket (Disponible, Ocupada, Esperando pago)
        type:
          type: string
          enum:
            - normal
            - vip
          example: normal
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CrearMesaRequest:
      type: object
      properties:
        name:
          type: string
          example: Mesa 5 Interior
        numero:
          type: string
          example: Mesa 5 Interior
        capacity:
          type: integer
          example: 4
