      payload:
        type: object
        properties:
          pedidoId:
            type: string
          codigo:
            type: string
          mesa:
            type: string
          mensaje:
            type: string
    mesas:pago_completado:
      summary: Confirmación de comanda cobrada y mesa liberada
      payload:
        type: object
        properties:
          pedidoId:
            type: string
          mesaId:
            type: string
          comprobante:
