components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Autenticación mediante token JWT en cabecera: Authorization: Bearer <token>'
  schemas:
    MensajeErrorResponse:
      type: object
      required:
        - mensaje
      properties:
        mensaje:
          type: string
          example: Mensaje descriptivo del error
    MensajeErrorDetalleResponse:
      type: object
      required:
        - mensaje
      properties:
        mensaje:
          type: string
          example: Error en el servidor
        error:
          type: string
          example: Detalle técnico del error
    MensajeRespuestaResponse:
      type: object
      required:
        - mensaje
      properties:
        mensaje:
          type: string
          example: Operación realizada exitosamente
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: API de Sabor & Gestión funcionando correctamente 🚀
    SubirImagenResponse:
      type: object
      properties:
        mensaje:
          type: string
          example: Imagen subida con éxito
        url:
          type: string
          example: https://res.cloudinary.com/demo/image/upload/sample.jpg
        publicId:
          type: string
          example: platos/abc123xyz
    UsuarioNormalizado:
      type: object
      properties:
        id:
          type: string
          example: '000000000000000000000001'
        _id:
          type: string
          example: '000000000000000000000001'
        nombre:
          type: string
          example: Juan
        apellido:
          type: string
          example: Pérez
        ci:
          type: string
          example: '12345678'
        email:
          type: string
          format: email
          example: juan.perez@example.com
        rol:
          type: string
          enum:
            - Administrador
            - Mesero
            - Cocinero
            - Cajero
          example: Mesero
        estado:
          type: boolean
          example: true
        verificado:
          type: boolean
          example: true
        zona:
          type: string
          example: Salón Principal
        ubicacion:
          type: string
          example: Salón Principal
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    LoginUsuarioRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: admin@example.com
        password:
          type: string
          format: password
          example: Password123!
    LoginUsuarioResponse:
      type: object
      properties:
        mensaje:
          type: string
          example: Login exitoso
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        usuario:
          $ref: '#/components/schemas/UsuarioNormalizado'
    CrearUsuarioRequest:
      type: object
      required:
        - nombre
        - apellido
        - ci
        - email
        - password
        - rol
      properties:
        nombre:
          type: string
          example: Carlos
        apellido:
          type: string
          example: Mendoza
        ci:
          type: string
          example: '87654321'
        email:
          type: string
          format: email
          example: carlos.mendoza@example.com
        password:
          type: string
          format: password
          example: ClaveSegura123!
        rol:
          type: string
          enum:
            - Administrador
            - Mesero
            - Cocinero
            - Cajero
          example: Cajero
        zona:
          type: string
          example: Salón Principal
    CrearUsuarioResponse:
      type: object
      properties:
        mensaje:
          type: string
          example: Usuario creado exitosamente
        usuario:
          $ref: '#/components/schemas/UsuarioNormalizado'
    ActualizarUsuarioRequest:
      type: object
      properties:
        nombre:
          type: string
          example: Carlos
        apellido:
          type: string
          example: Mendoza
        ci:
          type: string
          example: '87654321'
        email:
          type: string
          format: email
          example: carlos.mendoza@example.com
        password:
          type: string
          format: password
          example: NuevaClave456!
        rol:
          type: string
          enum:
            - Administrador
            - Mesero
            - Cocinero
            - Cajero
          example: Cajero
        zona:
