components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Autenticación mediante token JWT en cabecera: Authorization: Bearer <token>"
  schemas:
    MensajeErrorResponse:
      $ref: "#/components/schemas/ErrorResponse"
    MensajeRespuestaResponse:
      type: object
      required:
        - mensaje
      properties:
        mensaje:
          type: string
          example: Operación realizada exitosamente
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: API de Sabor & Gestión funcionando correctamente 🚀
    SubirImagenResponse:
      type: object
      properties:
        mensaje:
          type: string
          example: Imagen subida con éxito
        url:
          type: string
          example: https://res.cloudinary.com/demo/image/upload/sample.jpg
        publicId:
          type: string
          example: platos/abc123xyz
    UsuarioNormalizado:
      type: object
      properties:
        id:
          type: string
          example: "000000000000000000000001"
        nombre:
          type: string
          example: Juan
        apellido:
          type: string
          example: Pérez
        ci:
          type: string
          example: "12345678"
        email:
          type: string
          format: email
          example: juan.perez@example.com
        rol:
          type: string
          enum:
            - Administrador
            - Mesero
            - Cocinero
            - Cajero
          example: Mesero
        estado:
          type: boolean
          example: true
        verificado:
          type: boolean
          example: true
        createdAt:
          type: string
          example: "2026-10-01 11:12:15"
          description: Fecha de creación en hora de Bolivia (YYYY-MM-DD HH:mm:ss)
        updatedAt:
          type: string
          example: "2026-10-01 11:12:15"
          description: Fecha de última actualización en hora de Bolivia (YYYY-MM-DD HH:mm:ss)
    LoginUsuarioRequest:
      type: object
      required:
