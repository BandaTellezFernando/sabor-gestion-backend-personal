openapi: 3.0.3
info:
  title: Sabor & Gestión API
  description: |-
    API RESTful oficial y especificación de contratos del sistema integral de gestión gastronómica **Sabor & Gestión**.

    ### Autoridad Exclusiva del Backend
    El backend actual es la **única fuente de verdad** funcional, operativa y financiera del sistema:
    - **Estados de Pedido:** `ABIERTO`, `EN_PREPARACION`, `ENTREGADO`, `CANCELADO`, `CERRADO`.
    - **Estados de Mesa:** `Libre`, `Ocupada`, `Cuenta Solicitada` (con mapeos normalizados para clientes en respuestas DTO y WebSocket: `Disponible`, `Ocupada`, `Esperando pago`).
    - **Recogida de Pedidos:** `recogido` es metadata operativa (`boolean`, `recogidoPor`, `fechaRecogida`, `fechaRecogidaBolivia`) y **no** un estado de pedido. El estado se mantiene en `ENTREGADO`.
    - **Autoridad Financiera:** Los subtotales, descuentos, propinas y totales son recalculados y liquidados exclusivamente por el backend mediante transacciones atómicas; el backend no confía en montos provistos por el cliente.
    - **Métodos de Pago Oficiales:** Exclusivamente `Efectivo`, `Tarjeta` y `QR`.

    ### Comunicación en Tiempo Real (Socket.IO)
    El sistema emite eventos en tiempo real sobre WebSockets para sincronizar comandas de Cocina, estado de Mesas en Salón y notificaciones de Caja:
    - **`mesas:updated`**: Emitido globalmente tras cualquier cambio de estado, edición, creación, bloqueo temporal o liberación de mesa. Payload: `MesaResponseDTO` (`#/components/schemas/MesaResponseDTO`).
    - **`mesas:created`**: Emitido tras la creación de nuevas mesas. Payload: `MesaResponseDTO` o `MesaResponseDTO[]`.
    - **`mesas:deleted`**: Emitido tras eliminar una mesa. Payload: `{ id, mesaId }`.
    - **`mesas:alerta_listo`**: Notificación prioritaria a meseros cuando cocina pasa un pedido a `ENTREGADO` (`recogido: false`).
    - **`mesas:pago_completado`**: Notificación a meseros y salón tras liquidar la comanda en caja.
    - **`cocina:nuevo_pedido`**: Notificación a la pantalla KDS de Cocina ante una nueva comanda. Payload: `PedidoCocinaDTO`.
    - **`cocina:actualizar_tablero`**: Actualización del tablero KDS de cocina ante modificaciones o transiciones de estado. Payload: `PedidoCocinaDTO` / `Pedido`.
    - **`cocina:pedido_recogido`**: Retira la comanda del tablero de platos pendientes de recogida. Payload: `{ pedidoId, codigo, mesaId, mesaNombre, recogido: true, recogidoPor, fechaRecogida }`.
    - **`caja:nueva_cuenta` / `caja:solicitud_pago`**: Alerta a terminales de caja cuando un mesero solicita la cuenta de una mesa. Payload: `PayloadCajaDTO`.
    - **`caja:notificacion_qr`**: Alerta a caja ante la recepción de una notificación de pago QR.
    - **`caja:pago_confirmado`**: Notificación emitida tras procesar y liquidar exitosamente el cobro.
    - **`inventario:actualizado`**: Notificación general ante mutaciones en el inventario o recetas para refresco de vistas.
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: Servidor de desarrollo local
tags:
  - name: Usuarios
    description: Gestión de empleados, autenticación JWT, roles y control de caja
  - name: Categorías
    description: Categorización de platos del menú
  - name: Platos
    description: Catálogo de platos y gestión de menú
  - name: Mesas
    description: Administración y estado operativo de mesas en salón
  - name: Ubicaciones
    description: Áreas y zonas físicas del restaurante
  - name: Ingredientes
    description: Inventario de insumos e ingredientes con disponibilidad booleana
  - name: Recetas
    description: Escandallos y relación plato-ingredientes
  - name: Pedidos
    description: "Flujo completo de órdenes: creación, cocina, cuenta y cancelación"
  - name: Pagos
    description: Cobro, arqueo, generación de QR, simulación y facturación por correo
  - name: Dashboard
    description: Métricas, KPIs de ventas, ocupación y reportes del negocio
  - name: Upload
    description: Carga de imágenes multimedia hacia Cloudinary
  - name: Health
    description: Verificación de salud y disponibilidad del servicio
paths:
  /api/health:
    get:
      tags:
        - Health
      summary: Verificar el estado del servidor
      description: Endpoint público para comprobar la operatividad y estado de salud del backend.
      operationId: obtenerEstadoSalud
      responses:
        "200":
          description: Servidor en funcionamiento
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: success
                message: API de Sabor & Gestión funcionando correctamente 🚀
  /api/upload:
    post:
      tags:
        - Upload
      summary: Subir imagen a Cloudinary
      description: Sube un archivo de imagen al almacenamiento en la nube Cloudinary. Requiere rol Administrador. Debe enviarse como multipart/form-data con el campo "imagen".
      operationId: subirImagen
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - imagen
              properties:
                imagen:
                  type: string
                  format: binary
                  description: Archivo de imagen a subir (JPG, PNG, WebP)
      responses:
        "200":
          description: Imagen subida exitosamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubirImagenResponse"
        "400":
          description: No se proporcionó ninguna imagen válida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeErrorResponse"
        "401":
          description: No autenticado o token inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeErrorResponse"
        "403":
          description: Acceso denegado (requiere Administrador)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeErrorResponse"
        "500":
          description: Error interno al procesar la imagen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeErrorResponse"
  /api/usuarios/login:
    post:
      tags:
        - Usuarios
      summary: Iniciar sesión de empleado
      description: Endpoint público para autenticación de empleados (Administrador, Mesero, Cajero, Cocinero) con correo y contraseña. Devuelve token JWT firmado.
      operationId: loginUsuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginUsuarioRequest"
      responses:
        "200":
          description: Inicio de sesión exitoso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginUsuarioResponse"
        "400":
          description: Correo y contraseña requeridos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeErrorResponse"
        "401":
          description: Credenciales inválidas o usuario inactivo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeErrorResponse"
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeErrorResponse"
  /api/usuarios:
    get:
      tags:
        - Usuarios
      summary: Listar todos los usuarios
      description: Retorna la lista de empleados registrados con contraseñas excluidas. Requiere rol Administrador.
      operationId: obtenerUsuarios
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista de usuarios obtenida exitosamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UsuarioNormalizado"
        "401":
          description: No autenticado o token inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeErrorResponse"
        "403":
          description: Acceso denegado (requiere rol Administrador)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeErrorResponse"
        "500":
          description: Error al obtener usuarios
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeErrorResponse"
    post:
      tags:
        - Usuarios
      summary: Crear un nuevo usuario
      description: Crea un nuevo usuario empleado. Requiere rol de Administrador. Valida unicidad dual de CI y correo electrónico.
      operationId: crearUsuario
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrearUsuarioRequest"
      responses:
        "201":
          description: Usuario creado exitosamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrearUsuarioResponse"
        "400":
          description: Validación fallida o correo/CI duplicado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeErrorResponse"
        "401":
          description: No autenticado o token inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeErrorResponse"
        "403":
          description: Acceso denegado (requiere Administrador)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeErrorResponse"
        "500":
          description: Error en el servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeErrorResponse"
  /api/usuarios/{id}:
    put:
      tags:
        - Usuarios
      summary: Actualizar datos de un usuario
      description: Actualiza los datos del empleado especificado por ID. Requiere rol de Administrador. Si se envía nueva contraseña, se hashea con salt 10.
      operationId: actualizarUsuario
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador del usuario
          schema:
            type: string
          example: "{{usuarioId}}"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActualizarUsuarioRequest"
      responses:
        "200":
          description: Usuario actualizado exitosamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActualizarUsuarioResponse"
        "400":
          description: Datos inválidos o duplicado de CI/correo con otro usuario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeErrorResponse"
        "401":
          description: No autenticado o token inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeErrorResponse"
        "403":
          description: Acceso denegado (requiere Administrador)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeErrorResponse"
        "404":
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeErrorResponse"
        "500":
          description: Error al actualizar usuario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeErrorResponse"
    delete:
      tags:
        - Usuarios
      summary: Eliminar usuario físicamente
      description: Elimina permanentemente un usuario por su ID. Requiere rol de Administrador.
      operationId: eliminarUsuario
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador del usuario a eliminar
          schema:
            type: string
          example: "{{usuarioId}}"
      responses:
        "200":
          description: Usuario eliminado exitosamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeRespuestaResponse"
              example:
                mensaje: Usuario eliminado del sistema exitosamente
        "401":
          description: No autenticado o token inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeErrorResponse"
        "403":
          description: Acceso denegado (requiere Administrador)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeErrorResponse"
        "404":
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeErrorResponse"
        "500":
          description: Error al eliminar usuario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeErrorResponse"
  /api/usuarios/{id}/estado:
    patch:
      tags:
        - Usuarios
      summary: Cambiar estado activo/inactivo de un usuario
      description: Activa o desactiva a un usuario. Permitido para roles Administrador y Cajero. Si el usuario es Cajero, solo puede cambiar su propia caja y debe existir al menos una caja activa restante. Si se desactiva con un reporte de arqueo, se genera automáticamente el CierreCaja en la base de datos.
      operationId: cambiarEstadoUsuario
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador del usuario
          schema:
            type: string
          example: "{{usuarioId}}"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CambiarEstadoUsuarioRequest"
      responses:
        "200":
          description: Estado del usuario actualizado exitosamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CambiarEstadoUsuarioResponse"
        "400":
          description: Debe existir al menos una caja activa en el sistema
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeErrorResponse"
        "401":
          description: No autenticado o token inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeErrorResponse"
        "403":
          description: Acceso denegado (un cajero solo puede cambiar su propia caja o rol sin permisos)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeErrorResponse"
        "404":
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeErrorResponse"
        "500":
          description: Error al cambiar estado del usuario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeErrorResponse"
  /api/categorias:
    get:
      tags:
        - Categorías
      summary: Listar categorías del menú
      description: Endpoint público para consultar todas las categorías registradas en el menú.
      operationId: obtenerCategorias
      responses:
        "200":
          description: Lista de categorías obtenida exitosamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Categoria"
        "500":
          description: Error al obtener las categorías
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeErrorResponse"
    post:
      tags:
        - Categorías
      summary: Crear una nueva categoría
      description: Crea una categoría de menú. Requiere rol de Administrador. Valida que el nombre contenga solo letras y no esté duplicado.
      operationId: crearCategoria
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoriaRequest"
      responses:
        "201":
          description: Categoría creada exitosamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Categoria"
        "400":
          description: Nombre inválido o duplicado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeErrorResponse"
        "401":
          description: No autenticado o token inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeErrorResponse"
        "403":
          description: Acceso denegado (requiere Administrador)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeErrorResponse"
        "500":
          description: Error al crear la categoría
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeErrorResponse"
  /api/categorias/{id}:
    put:
      tags:
        - Categorías
      summary: Actualizar una categoría existente
      description: Actualiza el nombre de una categoría. Requiere rol de Administrador.
      operationId: actualizarCategoria
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador de la categoría
          schema:
            type: string
          example: "{{categoriaId}}"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoriaRequest"
      responses:
        "200":
          description: Categoría actualizada exitosamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Categoria"
        "400":
          description: Nombre inválido o duplicado con otra categoría
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeErrorResponse"
        "401":
          description: No autenticado o token inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeErrorResponse"
        "403":
          description: Acceso denegado (requiere Administrador)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeErrorResponse"
        "404":
          description: Categoría no encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeErrorResponse"
        "500":
          description: Error al actualizar categoría
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeErrorResponse"
    delete:
      tags:
        - Categorías
      summary: Eliminar una categoría
      description: Elimina una categoría por su identificador. Requiere rol de Administrador.
      operationId: eliminarCategoria
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador de la categoría
          schema:
            type: string
          example: "{{categoriaId}}"
      responses:
        "200":
          description: Categoría eliminada correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeRespuestaResponse"
              example:
                mensaje: Categoría eliminada correctamente
        "400":
          description: No se puede eliminar la categoría porque tiene platos asociados o ID inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeErrorResponse"
              example:
                mensaje: No se puede eliminar la categoría porque tiene platos asociados.
        "401":
          description: No autenticado o token inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeErrorResponse"
        "403":
          description: Acceso denegado (requiere Administrador)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeErrorResponse"
        "404":
          description: Categoría no encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeErrorResponse"
        "500":
          description: Error al eliminar categoría
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeErrorResponse"
  /api/platos:
    get:
      tags:
        - Platos
      summary: Listar catálogo de platos
      description: Endpoint público para consultar todos los platos del catálogo, con filtrado opcional por categoría.
      operationId: obtenerPlatos
      parameters:
        - name: category
          in: query
          required: false
          description: ID de la categoría para filtrar platos
          schema:
            type: string
          example: "{{categoriaId}}"
      responses:
        "200":
          description: Lista de platos obtenida exitosamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Plato"
        "500":
          description: Error al obtener platos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeErrorResponse"
    post:
      tags:
        - Platos
      summary: Crear un nuevo plato
      description: Crea un nuevo plato. Requiere rol Administrador. Obligatorio enviar imagenUrl e imagenPublicId obtenidas previamente desde POST /api/upload.
      operationId: crearPlato
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrearPlatoRequest"
      responses:
        "201":
          description: Plato creado exitosamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plato"
        "400":
          description: Falta imagenUrl o imagenPublicId de Cloudinary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeErrorResponse"
        "401":
          description: No autenticado o token inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeErrorResponse"
        "403":
          description: Acceso denegado (requiere Administrador)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeErrorResponse"
        "500":
          description: Error al crear el plato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeErrorResponse"
  /api/platos/{id}:
    get:
      tags:
        - Platos
      summary: Obtener detalle de un plato
      description: Obtiene el detalle de un plato por ID con su categoría poblada. Requiere usuario autenticado.
      operationId: obtenerPlatoPorId
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador del plato
          schema:
            type: string
          example: "{{platoId}}"
      responses:
        "200":
          description: Detalle del plato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plato"
        "401":
          description: No autenticado o token inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeErrorResponse"
        "404":
          description: Plato no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeErrorResponse"
        "500":
          description: Error al obtener el plato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeErrorResponse"
    put:
      tags:
        - Platos
      summary: Actualizar un plato
      description: Actualiza los campos de un plato. Requiere rol Administrador. Si se reemplaza la imagen, elimina automáticamente la anterior de Cloudinary.
      operationId: actualizarPlato
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador del plato
          schema:
            type: string
          example: "{{platoId}}"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActualizarPlatoRequest"
      responses:
        "200":
          description: Plato actualizado exitosamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plato"
        "401":
          description: No autenticado o token inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeErrorResponse"
        "403":
          description: Acceso denegado (requiere Administrador)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeErrorResponse"
        "404":
          description: Plato no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeErrorResponse"
        "500":
          description: Error al actualizar el plato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeErrorResponse"
    delete:
      tags:
        - Platos
      summary: Eliminar un plato e imagen
