  /api/pedidos:
    get:
      tags:
        - Pedidos
      summary: Listar pedidos con filtros
      description: "Obtiene los pedidos del restaurante con alcance automático según el rol del usuario autenticado: Administrador (acceso total y consulta de arqueos con reportesCierre=true), Mesero (restringido a sus propios pedidos creados; 403 si intenta consultar pedidos de otro mesero o reportesCierre=true), Cocinero (restringido a pedidos activos en preparación culinaria, sanitizado sin montos financieros ni datos de facturación; 403 si intenta reportesCierre=true). Rol Cajero denegado con 403 (debe utilizar /api/pedidos/pendientes-cobro). Requiere rol Administrador, Mesero o Cocinero."
      operationId: obtenerPedidos
      security:
        - bearerAuth: []
      parameters:
        - name: hoy
          in: query
          required: false
          description: Filtrar pedidos del día de hoy
          schema:
            type: boolean
        - name: fecha
          in: query
          required: false
          description: Filtrar por fecha específica (YYYY-MM-DD)
          schema:
            type: string
            format: date
          example: "2026-09-27"
        - name: mesa
          in: query
          required: false
          description: ID de la mesa para filtrar sus pedidos
          schema:
            type: string
          example: "{{mesaId}}"
        - name: activo
          in: query
          required: false
          description: Filtrar solo pedidos activos (estados ABIERTO, EN_PREPARACION, ENTREGADO)
          schema:
            type: boolean
        - name: cajero
          in: query
          required: false
          description: ID del cajero asignado
          schema:
            type: string
          example: "{{usuarioId}}"
        - name: mesero
          in: query
          required: false
          description: ID del usuario mesero que creó el pedido
          schema:
            type: string
          example: "{{usuarioId}}"
        - name: reportesCierre
          in: query
          required: false
          description: Parámetro de compatibilidad retroactiva temporal con el frontend para consultar los reportes de cierre de caja de las últimas 48 horas (pertenece funcionalmente al dominio de Caja, sujeto a futura migración hacia endpoints dedicados). Requiere rol Administrador.
          schema:
            type: boolean
        - name: recogido
          in: query
          required: false
          description: Filtrar por estado de recogida del pedido (true o false)
          schema:
            type: boolean
        - name: incluirRecogidos
          in: query
          required: false
          description: Si es true junto con activo=true, incluye pedidos en estado ENTREGADO que ya fueron recogidos
          schema:
            type: boolean
      responses:
        "200":
          description: Lista de pedidos o reportes de cierre según los filtros aplicados
          content:
            application/json:
              schema:
                type: array
                items:
                  oneOf:
                    - $ref: "#/components/schemas/Pedido"
                    - $ref: "#/components/schemas/PedidoCocinaDTO"
                    - $ref: "#/components/schemas/ReporteCierreCajaDTO"
        "401":
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeErrorResponse"
        "403":
          description: Acceso denegado (rol Cajero denegado, mesero consultando pedidos ajenos o no-admin solicitando reportes de cierre)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeErrorResponse"
        "500":
          description: Error al obtener pedidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeErrorResponse"
    post:
      tags:
        - Pedidos
      summary: Crear un nuevo pedido
      description: Crea un pedido validando previamente la disponibilidad de los ingredientes requeridos según las recetas. El backend calcula los subtotales e importes con los precios oficiales de Plato obtenidos vía PlatoRepository y almacena el snapshot histórico de precioUnitario; los importes enviados por el cliente no son confiables y se recalculan. Si se envía mesa y no existe en la base de datos, retorna 404. Genera el código correlativo PED-XXXX y cambia automáticamente el estado de la mesa a "Ocupada". Requiere rol Mesero o Administrador.
      operationId: crearPedido
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrearPedidoRequest"
      responses:
        "201":
          description: Pedido registrado exitosamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pedido"
        "400":
          description: Error de validación (ingredientes no disponibles, montos negativos o cantidades inválidas)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PedidoErrorIngredientesResponse"
        "401":
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeErrorResponse"
        "403":
          description: Acceso denegado (requiere rol Mesero o Administrador)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeErrorResponse"
        "404":
          description: Mesa no encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeErrorResponse"
        "500":
          description: Error al registrar pedido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeErrorResponse"
